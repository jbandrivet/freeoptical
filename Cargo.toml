[package]
name = "freeoptical"
version = "0.4.0"
edition = "2024"
authors = ["Jean-Baptiste"]
description = "Logiciel open-source de conception et de simulation optique séquentielle (interface graphique, TUI et serveur MCP)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbandrivet/freeoptical"

[dependencies]
# Interface Terminal (TUI) et Interface Graphique Native Autonome (GUI OpenGL)
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = "0.28"
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }

# Algèbre linéaire et calcul scientifique (Ray Tracing, DLS, Matrices Paraxiales)
nalgebra = { version = "0.33", features = ["serde-serialize"] }

# Sérialisation et formats de fichiers / JSON-RPC
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"

# SDK officiel Model Context Protocol (MCP) en Rust + Runtime asynchrone
rmcp = { version = "3.7", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.43", features = ["full"] }

# Gestion de la ligne de commande et des erreurs
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"

# Mise à jour en ligne (releases GitHub)
ureq = "3.5"
